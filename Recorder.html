<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rakam - eSMART</title>
<style>
  :root{--ink:#14154B;--sun:#FFC72C;--red:#D62839;--sky:#DCE6FF}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       height:100vh;text-align:center;padding:20px;box-sizing:border-box}
  .dot{width:96px;height:96px;border-radius:50%;background:var(--red);display:flex;
       align-items:center;justify-content:center;font-size:38px;margin-bottom:18px}
  .dot.live{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  button{margin-top:20px;font-size:17px;font-weight:800;padding:12px 26px;border-radius:999px;
         border:none;background:var(--sun);color:var(--ink);cursor:pointer}
  button:active{transform:translateY(1px)}
  p{font-weight:700;max-width:280px;line-height:1.4}
  .err{color:#FF9B9E;font-weight:800}
  .small{font-weight:600;font-size:13px;color:#B9BCE6;margin-top:10px}
</style>
</head>
<body>
  <div class="dot" id="dot">🎙️</div>
  <p id="msg">Sila benarkan akses mikrofon apabila diminta...</p>
  <button id="stopBtn" hidden>Berhenti &amp; hantar</button>
  <p class="small">Tetingkap ini akan tutup sendiri selepas selesai.</p>
<script>
(function(){
'use strict';
var maxSec=Number(new URLSearchParams(location.search).get('max')||'6');
var mediaRec=null,chunks=[],left=maxSec,timer=null,stream=null;
var dot=document.getElementById('dot'),msg=document.getElementById('msg'),stopBtn=document.getElementById('stopBtn');
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var srSupported=!!SR;
var srFinished=!srSupported;
var srTranscript=null;
var recog=null;
var srSafetyTimer=null;
var srStopTimer=null;
var audioFinished=false,audioResult=null,finished=false,finishing=false;
var bestConfidence=-1;

function send(payload){
  try{if(window.opener&&!window.opener.closed)window.opener.postMessage(payload,'*')}catch(e){}
}

function trySend(){
  if(finished||!audioFinished||!srFinished)return;
  finished=true;
  if(!audioResult){
    send({type:'esmart-rec-error',reason:'empty'});
    try{window.close()}catch(e){}
    return;
  }
  send({
    type:'esmart-rec-done',
    dataUrl:audioResult,
    transcript:srTranscript||null,
    transcriptSupported:srSupported,
    transcriptConfidence:bestConfidence
  });
  setTimeout(function(){try{window.close()}catch(e){}},80);
}

function stopRecognitionSoon(delay){
  clearTimeout(srStopTimer);
  srStopTimer=setTimeout(function(){
    if(!recog)return;
    try{recog.stop()}catch(e){
      try{recog.abort()}catch(e2){}
    }
  },delay||1200);
}

function finish(){
  if(finishing)return;
  finishing=true;
  clearInterval(timer);
  stopBtn.hidden=true;
  dot.classList.remove('live');
  msg.textContent='Menghantar rakaman...';

  /* Give speech recognition a short grace period to return its final result. */
  stopRecognitionSoon(1200);

  if(mediaRec&&mediaRec.state==='recording'){
    mediaRec.stop();
  }else if(!audioFinished){
    audioFinished=true;
    audioResult=null;
    trySend();
  }
}

window.addEventListener('message',function(ev){
  if(ev.data&&ev.data.type==='esmart-rec-stop')finish();
});
window.addEventListener('beforeunload',function(){
  if(!finished)send({type:'esmart-rec-closed'});
});

function startSpeechRecognition(){
  if(!srSupported){
    srFinished=true;
    return;
  }

  var attempts=0;

  function makeRecognition(){
    var r=new SR();
    r.lang='zh-CN';
    r.continuous=true;
    r.interimResults=true;
    r.maxAlternatives=3;

    r.onstart=function(){
      attempts=0;
    };

    r.onresult=function(e){
      var latest='',latestConfidence=-1;
      for(var i=0;i<e.results.length;i++){
        var result=e.results[i];
        if(!result||!result[0])continue;
        var transcript=result[0].transcript||'';
        var confidence=Number(result[0].confidence);
        if(transcript)latest+=transcript;
        if(!isNaN(confidence)&&confidence>=0)latestConfidence=Math.max(latestConfidence,confidence);
      }
      latest=String(latest||'').trim();
      if(latest){
        /* Keep interim text too: waiting only for a final result can miss short words. */
        srTranscript=latest;
        if(latestConfidence>=0)bestConfidence=Math.max(bestConfidence,latestConfidence);
      }
    };

    r.onnomatch=function(){};

    r.onerror=function(e){
      var code=e&&e.error||'';
      if(code==='not-allowed'||code==='service-not-allowed'){
        srSupported=false;
        srFinished=true;
        return;
      }
      /* no-speech/network/audio-capture can end recognition; onend handles retry. */
    };

    r.onend=function(){
      if(finishing||audioFinished||!mediaRec||mediaRec.state!=='recording'){
        srFinished=true;
        clearTimeout(srSafetyTimer);
        trySend();
        return;
      }
      if(attempts<6){
        attempts++;
        setTimeout(startAgain,180);
      }else{
        srFinished=true;
        clearTimeout(srSafetyTimer);
        trySend();
      }
    };
    return r;
  }

  function startAgain(){
    if(finishing||audioFinished||!mediaRec||mediaRec.state!=='recording')return;
    try{
      recog=makeRecognition();
      /* Use the normal microphone capture path. It is better supported than the
         experimental SpeechRecognition.start(MediaStreamTrack) path. */
      recog.start();
    }catch(e){
      attempts++;
      if(attempts<6)setTimeout(startAgain,300);
      else{
        srFinished=true;
        clearTimeout(srSafetyTimer);
        trySend();
      }
    }
  }

  srFinished=false;
  startAgain();
  clearTimeout(srSafetyTimer);
  srSafetyTimer=setTimeout(function(){
    if(!srFinished){
      try{if(recog)recog.stop()}catch(e){try{if(recog)recog.abort()}catch(e2){}}
      srFinished=true;
      trySend();
    }
  },(maxSec+3)*1000);
}

if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
  dot.textContent='⚠️';
  msg.innerHTML='<span class="err">Perakam tidak disokong pada pelayar ini.</span>';
  send({type:'esmart-rec-error',reason:'unsupported'});
}else{
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}})
    .then(function(s){
      stream=s;
      var types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
      var mime=types.filter(function(t){return MediaRecorder.isTypeSupported(t)})[0]||'';
      mediaRec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
      mediaRec.onstop=function(){
        if(stream)stream.getTracks().forEach(function(t){t.stop()});
        var blob=chunks.length?new Blob(chunks,{type:mediaRec.mimeType||mime||'audio/webm'}):null;
        if(!blob){audioFinished=true;audioResult=null;trySend();return}
        var fr=new FileReader();
        fr.onload=function(){audioFinished=true;audioResult=fr.result;trySend()};
        fr.onerror=function(){audioFinished=true;audioResult=null;trySend()};
        fr.readAsDataURL(blob);
      };
      mediaRec.start();
      dot.classList.add('live');
      msg.textContent='Sedang rakam... ('+left+'s)';
      stopBtn.hidden=false;
      stopBtn.addEventListener('click',finish);
      setTimeout(startSpeechRecognition,150);
      timer=setInterval(function(){
        left--;
        if(left<=0){finish();return}
        msg.textContent='Sedang rakam... ('+left+'s)';
      },1000);
    })
    .catch(function(e){
      var name=e&&e.name;
      var reason=name==='NotFoundError'?'nomic':(name==='NotReadableError'?'busy':'blocked');
      dot.textContent='⚠️';
      msg.innerHTML='<span class="err">Akses mikrofon ditolak atau tidak tersedia.</span>';
      if(recog){try{recog.abort()}catch(e2){}}
      send({type:'esmart-rec-error',reason:reason});
      try{window.close()}catch(e2){}
    });
}
})();
</script>
</body>
</html>
